name: Deploy MusicScene Site

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Build & Export Next.js
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || 'G-B8JG49MGFD' }}
        run: |
          npm install
          npm install lightningcss-linux-x64-gnu@1.29.2 @tailwindcss/oxide-linux-x64-gnu@4.1.4 @img/sharp-linux-x64@0.34.1 --no-save
          npm run build

      - name: Sync to S3
        run: |
           aws s3 sync ./out s3://musicscene --delete

      - name: Invalidate CloudFront Cache
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}
        run: |
          TARGET_DIST="${DIST_ID:-EMEO566RGP4JE}"
          if [ -z "$TARGET_DIST" ]; then
            echo "❌ No CloudFront distribution ID provided—skipping invalidation"
            exit 0
          fi

          aws cloudfront create-invalidation --distribution-id "$TARGET_DIST" --paths '/*'
          echo "Invalidated CloudFront cache for distribution ID: $TARGET_DIST"
          echo "Deployment complete!"		
