<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="624" viewBox="0 0 1640 624">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0b0f19" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyanOrb" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Bar Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7" />
    </linearGradient>

    <!-- Fretboard Gradients -->
    <linearGradient id="fretWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Stage Background -->
  <rect width="1640" height="624" fill="url(#bgGrad)" />
  <rect width="1640" height="624" fill="url(#cyanOrb)" />
  <rect width="1640" height="624" fill="url(#purpleOrb)" />
  <rect width="1640" height="624" fill="url(#blueGlow)" />

  <!-- Background Grid Pattern for high-tech aesthetic -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="1640" y2="80" />
    <line x1="0" y1="160" x2="1640" y2="160" />
    <line x1="0" y1="240" x2="1640" y2="240" />
    <line x1="0" y1="320" x2="1640" y2="320" />
    <line x1="0" y1="400" x2="1640" y2="400" />
    <line x1="0" y1="480" x2="1640" y2="480" />
    <line x1="0" y1="560" x2="1640" y2="560" />
    
    <line x1="160" y1="0" x2="160" y2="624" />
    <line x1="320" y1="0" x2="320" y2="624" />
    <line x1="480" y1="0" x2="480" y2="624" />
    <line x1="640" y1="0" x2="640" y2="624" />
    <line x1="800" y1="0" x2="800" y2="624" />
    <line x1="960" y1="0" x2="960" y2="624" />
    <line x1="1120" y1="0" x2="1120" y2="624" />
    <line x1="1280" y1="0" x2="1280" y2="624" />
    <line x1="1440" y1="0" x2="1440" y2="624" />
  </g>

  <!-- ================= RIGHT SIDE: STYLIZED INTERACTIVE FRETBOARD ================= -->
  <g transform="translate(920, 110) rotate(-6)">
    <!-- Fretboard Neck Base -->
    <rect x="0" y="0" width="680" height="340" rx="16" fill="url(#fretWood)" stroke="#3f3f46" stroke-width="2" />
    
    <!-- Frets (Vertical bars) -->
    <line x1="50" y1="0" x2="50" y2="340" stroke="#71717a" stroke-width="4" />
    <line x1="150" y1="0" x2="150" y2="340" stroke="#a1a1aa" stroke-width="3" />
    <line x1="250" y1="0" x2="250" y2="340" stroke="#a1a1aa" stroke-width="3" />
    <line x1="350" y1="0" x2="350" y2="340" stroke="#a1a1aa" stroke-width="3" />
    <line x1="450" y1="0" x2="450" y2="340" stroke="#a1a1aa" stroke-width="3" />
    <line x1="550" y1="0" x2="550" y2="340" stroke="#a1a1aa" stroke-width="3" />
    <line x1="640" y1="0" x2="640" y2="340" stroke="#a1a1aa" stroke-width="3" />

    <!-- Fret Inlay Markers (Dots) -->
    <circle cx="200" cy="170" r="10" fill="#e4e4e7" opacity="0.4" /> <!-- 3rd fret -->
    <circle cx="300" cy="170" r="10" fill="#e4e4e7" opacity="0.4" /> <!-- 5th fret -->
    <circle cx="400" cy="170" r="10" fill="#e4e4e7" opacity="0.4" /> <!-- 7th fret -->
    <circle cx="500" cy="170" r="10" fill="#e4e4e7" opacity="0.4" /> <!-- 9th fret -->
    <circle cx="600" cy="100" r="8" fill="#e4e4e7" opacity="0.4" /> <!-- 12th fret double -->
    <circle cx="600" cy="240" r="8" fill="#e4e4e7" opacity="0.4" />

    <!-- Strings (Horizontal lines with thickness variation) -->
    <line x1="0" y1="35" x2="680" y2="35" stroke="#cbd5e1" stroke-width="1.8" />
    <line x1="0" y1="90" x2="680" y2="90" stroke="#cbd5e1" stroke-width="2.4" />
    <line x1="0" y1="145" x2="680" y2="145" stroke="#e2e8f0" stroke-width="3.0" />
    <line x1="0" y1="200" x2="680" y2="200" stroke="#fbbf24" stroke-width="3.8" stroke-opacity="0.85" />
    <line x1="0" y1="255" x2="680" y2="255" stroke="#fbbf24" stroke-width="4.6" stroke-opacity="0.85" />
    <line x1="0" y1="310" x2="680" y2="310" stroke="#fbbf24" stroke-width="5.5" stroke-opacity="0.85" />

    <!-- Glowing Interactive Chord Tone Badges -->
    <!-- Root Note (Coral/Red) -->
    <g transform="translate(300, 200)">
      <circle cx="0" cy="0" r="22" fill="#e11d48" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="19" fill="#f43f5e" stroke="#ffe4e6" stroke-width="2" />
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>
    </g>

    <!-- 3rd Note (Amber) -->
    <g transform="translate(400, 145)">
      <circle cx="0" cy="0" r="22" fill="#d97706" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="19" fill="#fbbf24" stroke="#fef3c7" stroke-width="2" />
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#78350f" text-anchor="middle">3rd</text>
    </g>

    <!-- 5th Note (Cyan) -->
    <g transform="translate(500, 90)">
      <circle cx="0" cy="0" r="22" fill="#0891b2" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="19" fill="#06b6d4" stroke="#cffafe" stroke-width="2" />
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#083344" text-anchor="middle">5th</text>
    </g>

    <!-- 7th Note (Emerald) -->
    <g transform="translate(200, 90)">
      <circle cx="0" cy="0" r="22" fill="#059669" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="19" fill="#10b981" stroke="#d1fae5" stroke-width="2" />
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#064e3b" text-anchor="middle">b7</text>
    </g>

    <!-- Octave Root -->
    <g transform="translate(600, 35)">
      <circle cx="0" cy="0" r="22" fill="#e11d48" filter="url(#softGlow)" />
      <circle cx="0" cy="0" r="19" fill="#f43f5e" stroke="#ffe4e6" stroke-width="2" />
      <text x="0" y="7" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">R</text>
    </g>

    <!-- Floating Interactive Card: Current Song Preview -->
    <g transform="translate(80, 240)">
      <rect x="0" y="0" width="310" height="66" rx="12" fill="#090d16" fill-opacity="0.92" stroke="#06b6d4" stroke-width="1.5" filter="url(#softGlow)" />
      <!-- Soundwave Icon -->
      <g transform="translate(20, 20)">
        <rect x="0" y="10" width="3" height="12" rx="1.5" fill="#06b6d4" />
        <rect x="6" y="4" width="3" height="22" rx="1.5" fill="#38bdf8" />
        <rect x="12" y="0" width="3" height="30" rx="1.5" fill="#60a5fa" />
        <rect x="18" y="7" width="3" height="17" rx="1.5" fill="#38bdf8" />
        <rect x="24" y="12" width="3" height="10" rx="1.5" fill="#06b6d4" />
      </g>
      <text x="60" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">Oye Como Va • Santana</text>
      <text x="60" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Interactive Tab &amp; Dorian Chord Sync</text>
    </g>
  </g>

  <!-- ================= LEFT SIDE: BRANDING, TITLE & VALUE PROPOSITION ================= -->
  <g transform="translate(100, 0)">
    
    <!-- Top Pill: Category / Identity -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="330" height="36" rx="18" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <!-- Pulsing Cyan Dot -->
      <circle cx="20" cy="18" r="5" fill="#06b6d4" filter="url(#softGlow)" />
      <circle cx="20" cy="18" r="3.5" fill="#ffffff" />
      <text x="36" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" fill="#38bdf8">FREE GUITAR LEARNING PLATFORM</text>
    </g>

    <!-- Main Brand Name -->
    <g transform="translate(0, 185)">
      <!-- Drop shadow text -->
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="950" letter-spacing="3" fill="#000000" opacity="0.6">MUSICSCENE</text>
      <!-- Main white text -->
      <text x="-2" y="-2" font-family="system-ui, -apple-system, sans-serif" font-size="78" font-weight="950" letter-spacing="3" fill="#ffffff">MUSICSCENE</text>
      <!-- Brand Gradient Underline -->
      <rect x="0" y="16" width="460" height="6" rx="3" fill="url(#brandGrad)" />
    </g>

    <!-- Headline Value Proposition -->
    <g transform="translate(0, 255)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f1f5f9" letter-spacing="-0.5">
        Interactive Song Breakdowns
      </text>
      <text x="0" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#38bdf8" letter-spacing="-0.5">
        &amp; Visual Fretboard Practice
      </text>
      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#94a3b8">
        Connect chords, solos, and music theory directly on the neck.
      </text>
    </g>

    <!-- Feature Highlights Row -->
    <g transform="translate(0, 395)">
      <!-- Badge 1: 226+ Songs -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="21" r="4" fill="#34d399" />
        <text x="34" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">226+ Songs</text>
      </g>

      <!-- Badge 2: Real-time Audio Tab -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="195" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="21" r="4" fill="#38bdf8" />
        <text x="34" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Audio Tab Sync</text>
      </g>

      <!-- Badge 3: Note Hunt Game -->
      <g transform="translate(400, 0)">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="21" r="4" fill="#fbbf24" />
        <text x="34" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Note Hunt Game</text>
      </g>

      <!-- Badge 4: Circle of 5ths -->
      <g transform="translate(595, 0)">
        <rect x="0" y="0" width="190" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
        <circle cx="20" cy="21" r="4" fill="#c084fc" />
        <text x="34" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Circle of Fifths</text>
      </g>
    </g>

    <!-- Bottom URL Callout Bar -->
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="480" height="56" rx="28" fill="#020617" fill-opacity="0.9" stroke="url(#brandGrad)" stroke-width="2" />
      
      <!-- Globe Icon -->
      <g transform="translate(24, 18)" stroke="#38bdf8" stroke-width="2" fill="none">
        <circle cx="10" cy="10" r="9" />
        <ellipse cx="10" cy="10" rx="4" ry="9" />
        <line x1="1" y1="10" x2="19" y2="10" />
      </g>

      <text x="56" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="0.5">
        musicscene.com.au
      </text>

      <!-- Free badge inside bar -->
      <rect x="365" y="12" width="95" height="32" rx="16" fill="#10b981" />
      <text x="412" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">100% FREE</text>
    </g>

  </g>

  <!-- Outer Border Highlight -->
  <rect x="1" y="1" width="1638" height="622" rx="0" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>